<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal AI OS · Emotional Aftereffect</title><link rel="stylesheet" href="/style.css">
<body><link rel="stylesheet" href="/startup/animation.css"><aside><h2>Personal AI OS <small>V4.0</small></h2><p>生活的脈絡，慢慢看清。</p><nav id="modules"></nav><small>本機儲存 · 無付費 API</small></aside>
<main><header><span>01 / 情緒餘波</span><span id="mode">本機資料</span></header><h1>情緒過後，仍有回聲。</h1><p>追蹤正負向高峰與延遲心情，辨識現在與過去的風險。</p>
<div class="toolbar"><button id="demo">檢視合成示範</button><button id="live">返回本機資料</button><button id="export">匯出完整 JSON</button><label class="button">合併匯入 JSON<input id="import" type="file" accept=".json,application/json"></label></div>
<p id="message" role="status" aria-live="polite"></p><section id="warnings" aria-label="風險提醒"></section><section id="stats" class="stats"></section>
<section class="panel"><h2>餘波時間線</h2><p>橫軸為高峰後經過小時，縱軸為實際回報心情（−10 至 +10）。點位不代表因果推論。</p><div id="chart"></div><div id="legend"></div></section>
<section class="panel"><h2>新增情緒高峰</h2><form id="event-form"><label>事件名稱<input name="title" required maxlength="120"></label><label>情緒方向<select name="valence"><option value="positive">正向</option><option value="negative">負向</option></select></label><label>高峰時間<input name="peakAt" type="datetime-local" required></label><label>高峰強度 0–10<input name="intensity" type="number" min="0" max="10" value="5" required></label><label>狀態<select name="status"><option value="active">仍在追蹤</option><option value="closed">已結束</option></select></label><fieldset><legend>個人追蹤指標（各 0–6，合計 24；暫定規則，非臨床量表）</legend><label>困擾程度<input name="risk0" type="number" min="0" max="6" value="0" required></label><label>生活影響<input name="risk1" type="number" min="0" max="6" value="0" required></label><label>持續負擔<input name="risk2" type="number" min="0" max="6" value="0" required></label><label>支持不足<input name="risk3" type="number" min="0" max="6" value="0" required></label></fieldset><button>儲存高峰</button></form></section>
<section class="panel"><h2>事件與延遲回報</h2><div id="events"></div></section><footer>21/24 以上列為追蹤提醒；已結束事件僅列歷史提醒。此工具不從分數推定緊急狀態。</footer></main><script type="module" src="/app.mjs"></script><script type="module" src="/startup/start.mjs"></script></body></html>
